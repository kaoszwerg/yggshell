[package]
name = "yggshell"
version = "0.57.0"
description = "A Norse-inspired developer terminal, and a full replacement for the system one: independent tabs with tmux sessions that survive a crash, iTerm2-compatible themes and a theme editor, launchable from anywhere with `ygg`. What it adds is the work around the terminal — the repository, the files, the processes and ports, the containers, the sessions, and what an AI harness such as Claude Code is doing right now, each in the sidebar beside the shell rather than in another window. It is built to be used every day and extended continuously, so that running an agentic workflow needs one window instead of six."
authors = ["kaoszwerg"]
edition = "2021"
publish = false
# The app binary carries the product name so the dev dock/process shows it (ADR-024).
default-run = "yggshell"

[lib]
# `_lib` suffix keeps the lib name distinct from the bin on Windows (rust-lang/cargo#8519).
name = "yggshell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "yggshell"
path = "src/main.rs"

# Versions pinned to the stable releases used by the shell and verified against crates.io (ADR-009).
# EXACT `=` requirements (ADR-CORE-039, ADR-APP-033: dep-pinning at maximum): the manifest itself pins each
# direct dependency to the exact version the committed Cargo.lock resolved and tested — not only the lock —
# so a `cargo update` cannot silently move a direct dep. Bumping one is a deliberate edit of both files.

[build-dependencies]
tauri-build = { version = "=2.6.3", features = [] }

[dependencies]
tauri = { version = "=2.11.5", features = ["tray-icon", "macos-private-api"] }
tauri-plugin-window-state = "=2.4.1"
# Reading the clipboard from the BACKEND, because the webview cannot do it without asking.
# `navigator.clipboard.readText()` is permission-gated in WKWebView: choosing Paste from the terminal's
# own context menu produced a native confirmation the user never saw, pasted nothing, left the menu
# stuck and stalled rendering until they clicked elsewhere. A terminal that has to ask permission to
# paste into itself is not a terminal. Official Tauri plugin, same source as the framework and the
# window-state plugin above, Apache-2.0/MIT (rule:dependencies).
tauri-plugin-clipboard-manager = "=2.3.2"
# The native file picker, used from RUST and never from the webview (ADR-PROJ-004).
#
# Importing a markdown file needs the user to name one, and this app has no filesystem capability in
# the webview at all. Opening the dialog in the command means the frontend asks for "import into this
# project" and the chosen path never reaches it — so the rule that the webview names a project and
# never a path survives the feature instead of gaining an exception. No `@tauri-apps/plugin-dialog` on
# the npm side, no new webview capability, nothing added to ui-boundary.json.
#
# Official Tauri plugin, same source and licence (Apache-2.0/MIT) as the two above (rule:dependencies).
tauri-plugin-dialog = "=2.7.2"
# Fetching a REMOTE image in a note, once, because the user pressed a control (ADR-PROJ-004). The
# webview never opens a connection of its own: that is what keeps the CSP posture intact and stops the
# request carrying a referrer or a user agent anywhere.
#
# Costs almost nothing here, which is why the feature is built as designed rather than dropped: Tauri
# already pulls reqwest 0.13.4 in transitively, so this adds a direct edge and no new crates. Default
# features off — no cookies, no proxies, no multipart, and rustls rather than the platform's TLS, so
# the whole surface is one https GET (rule:dependencies: prefer the smaller thing).
reqwest = { version = "=0.13.4", default-features = false, features = ["rustls", "http2"] }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"
tracing = "=0.1.44"
tracing-subscriber = { version = "=0.3.23", features = ["env-filter", "json"] }
tracing-appender = "=0.2.5"
chrono = { version = "=0.4.45", features = ["serde"] }
thiserror = "=2.0.18"
ts-rs = "=12.0.1"
tokio = { version = "=1.52.3", features = ["rt-multi-thread", "macros", "sync"] }
# The PTY, behind src/terminal/pty.rs — the only file allowed to name it (ADR-PROJ-001 §2).
portable-pty = "=0.9.0"
# Git, in pure Rust — no libgit2 C build on any of the three platforms (ADR-PROJ-001 C3).
# Behind src/git/, the only module allowed to name it.
gix = { version = "=0.86.0", default-features = false, features = ["max-performance-safe", "sha1", "basic", "comfort", "auto-chain-error", "status", "revision", "blob-diff"] }

# On non-Windows targets the `open` crate handles URL launching via the system default handler.
# On Windows we drive ShellExecuteW directly (see commands::open_external) — `cmd /c start` from a
# windows-subsystem binary exits silently before the browser appears.
[target.'cfg(not(target_os = "windows"))'.dependencies]
open = "=5.3.6"

[target.'cfg(target_os = "windows")'.dependencies]
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging"] }

[dev-dependencies]
tempfile = "=3.27.0"

# Maximum defensible posture (ADR-CORE-039, ADR-APP-033). Every unsafe block must justify itself in a
# `// SAFETY:` comment — an undocumented one is a denied clippy lint, not a review note.
[lints.clippy]
undocumented_unsafe_blocks = "deny"

# Integer overflow is a security class, not just a bug: in release, wrapping is silent by default. Turn on
# the checks so an overflow panics (and is caught by the crash handler, ADR-APP-032) instead of corrupting.
[profile.release]
overflow-checks = true

# The Finder context-menu entry is an NSServices provider, which has to be registered against AppKit
# at runtime — there is no other mechanism that produces that menu item (services.rs). Both crates are
# ALREADY in the tree via tao/wry, pinned to the versions Tauri resolved, so this adds no new
# third-party code to audit (rule:dependencies).
# The load average, via POSIX `getloadavg`. Already in the tree transitively; declared here because
# a direct use should be a direct dependency, and pinned to the version the tree resolved.
[target.'cfg(unix)'.dependencies]
libc = "=0.2.186"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "=0.6.4"
objc2-app-kit = { version = "=0.3.2", features = ["NSApplication", "NSPasteboard", "NSResponder", "NSWindow"] }
objc2-foundation = { version = "=0.3.2", features = ["NSArray", "NSBundle", "NSString", "NSURL"] }
