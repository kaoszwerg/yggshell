<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- YggShell — Yggdrasil carved as a rune-stave standing on a shell prompt: one vertical stave, two
       branch tiers, a root spread, and a command line with a block cursor. Seven strokes plus two
       solids, so the silhouette survives 32px (verified by rasterising to 32px, not assumed).

       GEOMETRY IS NOT FREE HERE. macOS expects the artwork inside a rounded square that occupies
       824×824 of the 1024 canvas, leaving a transparent margin — the Big Sur template. A full-bleed
       icon renders larger and squarer than every neighbour in the Dock, and its corners disagree with
       the system squircle. So the plate is 824 wide at (100,100) with a 185 radius, and the motif is
       scaled into it rather than redrawn.

       There is deliberately no inset outline. The one that used to be here — a 22%-opacity cyan
       hairline — read on the near-black plate as a dull grey border around the whole icon, which is
       exactly the thing a HUD mark must not have.

       Colours mirror the palette (rule:theming): #0a0a0f plate, #00e5ff cyan, #00ff88 green. -->
  <defs>
    <linearGradient id="edge" x1="0" y1="253" x2="0" y2="744" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00e5ff" />
      <stop offset="1" stop-color="#00ff88" />
    </linearGradient>
  </defs>

  <rect x="100" y="100" width="824" height="824" rx="185" fill="#0a0a0f" />

  <!-- The motif in its original 1024 coordinates, scaled into the plate — so the drawing that was
       checked for legibility at 32px is the same drawing, only placed correctly. -->
  <g transform="translate(100 100) scale(0.8047)">
    <g stroke="url(#edge)" stroke-width="50" stroke-linecap="round" stroke-linejoin="round" fill="none">
      <!-- Stave -->
      <path d="M512 214 L512 764" />
      <!-- Crown: two branch tiers, rising outward -->
      <path d="M512 300 L352 196" />
      <path d="M512 300 L672 196" />
      <path d="M512 450 L286 316" />
      <path d="M512 450 L738 316" />
      <!-- Roots -->
      <path d="M512 690 L322 786" />
      <path d="M512 690 L702 786" />
    </g>

    <!-- The prompt the tree stands on, and its block cursor -->
    <rect x="228" y="848" width="568" height="30" rx="15" fill="#00e5ff" opacity="0.45" />
    <rect x="640" y="824" width="86" height="78" rx="10" fill="#00ff88" />
  </g>
</svg>
